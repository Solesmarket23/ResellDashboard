name: FlipFlowNative

options:
  bundleIdPrefix: com.flipflow.app
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 11.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: 8.0.0

settings:
  base:
    PRODUCT_NAME: "Flip Flow Native"
    PRODUCT_BUNDLE_IDENTIFIER: com.flipflow.app.native.dev
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 3SFYC3VA37
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 16.0
    TARGETED_DEVICE_FAMILY: "1" # iPhone
    SUPPORTS_MACCATALYST: NO

targets:
  FlipFlowNative:
    type: application
    platform: iOS
    bundleId: com.flipflow.app.native.dev
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3SFYC3VA37
        TARGETED_DEVICE_FAMILY: "1" # iPhone only (prevents any compatibility layout)
    sources:
      - path: Sources/FlipFlowNative
      - path: Resources
        buildPhase: resources
        excludes:
          - Info.plist
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: "Flip Flow Native"
        NSCameraUsageDescription: "Scan tracking numbers and QR codes for receiving and authentication."
        NSMicrophoneUsageDescription: "Microphone access is not required for receiving, but may be used for future voice features."
        UILaunchStoryboardName: "LaunchScreen"
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn

