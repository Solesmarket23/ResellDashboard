name: Monitor StockX Prices

on:
  schedule:
    # Run every hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install Firebase Admin
        run: npm install firebase-admin
        
      - name: Run Price Monitor
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: node scripts/monitor-prices.js
        
      - name: Alternative - Call API Endpoint
        if: failure()
        run: |
          echo "🔍 Checking StockX prices..."
          
          # Make request with GitHub Actions user agent
          response=$(curl -s -w "\n%{http_code}" \
            -H "User-Agent: GitHub-Actions" \
            https://solesmarket.com/api/cron/monitor-prices)
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          echo "Response Code: $http_code"
          echo "Response Body: $body"
          
          # Pretty print JSON if possible
          if command -v jq &> /dev/null && [ "$http_code" != "000" ]; then
            echo "$body" | jq . 2>/dev/null || echo "$body"
          fi
          
          if [ $http_code -eq 200 ]; then
            echo "✅ Price monitoring completed successfully"
          elif [ $http_code -eq 500 ]; then
            echo "⚠️ Server error - likely missing Firebase credentials"
            echo "This is expected until Firebase Admin is properly configured"
            # Don't fail the job for now
            exit 0
          else
            echo "❌ Price monitoring failed with status $http_code"
            exit 1
          fi
      
      - name: Log Results
        if: always()
        run: |
          echo "Timestamp: $(date)"
          echo "Job completed"