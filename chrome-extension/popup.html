<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
    }
    
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    
    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #667eea;
      margin-bottom: 8px;
    }
    
    .subtitle {
      font-size: 14px;
      color: #666;
    }
    
    .status {
      background: #f0f9ff;
      border: 1px solid #0ea5e9;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 20px;
    }
    
    .status-title {
      font-weight: 600;
      color: #0369a1;
      margin-bottom: 4px;
    }
    
    .status-text {
      font-size: 13px;
      color: #0c4a6e;
    }
    
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .btn {
      background: #667eea;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    
    .btn:hover {
      background: #5a67d8;
    }
    
    .btn:disabled {
      background: #cbd5e0;
      cursor: not-allowed;
    }
    
    .btn-secondary {
      background: #e2e8f0;
      color: #4a5568;
    }
    
    .btn-secondary:hover {
      background: #cbd5e0;
    }
    
    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">📊 StockX Tracker</div>
    <div class="subtitle">Market Price Extension</div>
  </div>
  
  <div class="status">
    <div class="status-title">Extension Status</div>
    <div class="status-text" id="statusText">Checking connection...</div>
  </div>
  
  <div class="actions">
    <button class="btn" id="refreshBtn">Refresh Current Page</button>
    <button class="btn btn-secondary" id="dashboardBtn">Dashboard</button>
    <button class="btn btn-secondary" id="settingsBtn">Settings</button>
    <button class="btn btn-secondary" id="helpBtn">Help</button>
  </div>
  
  <div class="footer">
    <div>Version 1.0.0</div>
    <div>Made for StockX resellers</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
